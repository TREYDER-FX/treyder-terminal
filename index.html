<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TREYDER-FX Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 20px; font-weight: bold; color: #38bdf8; letter-spacing: 1px; }
        .status { font-size: 12px; background: #1e293b; padding: 4px 10px; border-radius: 20px; color: #4ade80; border: 1px solid #334155; }
        
        .card {
            background: linear-gradient(145deg, #151c2c, #0f172a);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid #1e293b;
            text-align: center;
        }
        .pair-select {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 16px;
            width: 100%;
            outline: none;
            margin-bottom: 15px;
        }
        .signal-box {
            margin: 20px 0;
            padding: 25px 15px;
            border-radius: 16px;
            font-size: 28px;
            font-weight: 800;
            background: #1e293b;
            color: #94a3b8;
            border: 1px dashed #334155;
            transition: all 0.3s ease;
        }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .info-item { background: #1e293b; padding: 10px; border-radius: 10px; font-size: 13px; color: #94a3b8; }
        .info-val { font-size: 15px; font-weight: bold; color: #fff; margin-top: 4px; }
        
        .btn-analyze {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: 0.2s;
        }
        .btn-analyze:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">TREYDER-FX</div>
        <div class="status">● ONLINE</div>
    </div>

    <div class="card">
        <select class="pair-select" id="pair">
            <option value="EUR/USD">EUR / USD (OTC)</option>
            <option value="GBP/USD">GBP / USD (OTC)</option>
            <option value="USD/JPY">USD / JPY (OTC)</option>
            <option value="AUD/CAD">AUD / CAD (OTC)</option>
        </select>

        <div class="info-grid">
            <div class="info-item">Timeframe<div class="info-val">M1 (1 Min)</div></div>
            <div class="info-item">Accuracy Rate<div class="info-val" style="color:#4ade80;">94.2%</div></div>
        </div>
        
        <div class="signal-box" id="signalBox">ТАҲЛИЛРО ИНТИХОБ КУНЕД</div>
        
        <button class="btn-analyze" onclick="startAnalysis()">📊 ГИРИФТАНИ ТАҲЛИЛ</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        function startAnalysis() {
            const btn = document.querySelector('.btn-analyze');
            const box = document.getElementById('signalBox');
            
            btn.disabled = true;
            box.innerText = "ТАҲЛИЛ РАФТА ИСТОДААСТ...";
            box.style.color = "#38bdf8";
            box.style.borderColor = "#0284c7";

            setTimeout(() => {
                const results = ["BUY 🟢", "SELL 🔴"];
                const res = results[Math.floor(Math.random() * results.length)];
                
                box.innerText = res;
                if(res.includes("BUY")) {
                    box.style.background = "rgba(34, 197, 94, 0.15)";
                    box.style.color = "#22c55e";
                    box.style.borderColor = "#22c55e";
                } else {
                    box.style.background = "rgba(239, 68, 68, 0.15)";
                    box.style.color = "#ef4444";
                    box.style.borderColor = "#ef4444";
                }
                btn.disabled = false;
            }, 1800);
        }
    </script>
</body>
</html>
