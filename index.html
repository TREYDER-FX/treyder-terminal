<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TREYDER-FX PRO TERMINAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body {
            background-color: #090d16;
            color: #ffffff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .logo { font-size: 22px; font-weight: 900; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
        .status { font-size: 11px; background: rgba(34, 197, 94, 0.15); color: #22c55e; padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(34, 197, 94, 0.3); }

        .card {
            background: linear-gradient(145deg, #111827, #0b0f19);
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid #1f293d;
        }
        
        .label { font-size: 11px; color: #64748b; margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

        select {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            outline: none;
            margin-bottom: 16px;
        }

        optgroup { background: #0f172a; color: #38bdf8; font-weight: bold; }
        option { background: #1e293b; color: #ffffff; }

        .tf-group { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
        .tf-btn {
            flex: 1;
            min-width: 50px;
            padding: 8px 0;
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .tf-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

        .signal-box {
            margin: 16px 0;
            padding: 22px;
            border-radius: 20px;
            text-align: center;
            background: #161f30;
            border: 2px dashed #334155;
            transition: all 0.4s ease;
        }
        .signal-title { font-size: 28px; font-weight: 900; letter-spacing: 1px; }
        .signal-sub { font-size: 12px; color: #94a3b8; margin-top: 4px; }

        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .detail-card { background: #1a2336; padding: 10px 14px; border-radius: 12px; border: 1px solid #28354d; }
        .detail-val { font-size: 13px; font-weight: bold; color: #38bdf8; margin-top: 2px; }

        .btn-analyze {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
            transition: 0.2s;
        }
        .btn-analyze:active { transform: scale(0.97); }

        .progress-bar {
            height: 4px;
            width: 0%;
            background: #38bdf8;
            border-radius: 2px;
            margin-top: 10px;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">TREYDER-FX PRO</div>
        <div class="status">● AI ALGO LIVE</div>
    </div>

    <div class="card">
        <div class="label">Интихоби бозор / Актив</div>
        <select id="pair">
            <optgroup label="🟡 МЕТАЛЛҲО ВА ЭНЕРГИЯ (COMMODITIES)">
                <option value="XAU/USD (Gold)">GOLD / US DOLLAR (Тилло)</option>
                <option value="XAG/USD (Silver)">SILVER / US DOLLAR (Нуқра)</option>
                <option value="USOIL (WTI)">US OIL / WTI (Нефт)</option>
                <option value="UKOIL (Brent)">UK OIL / BRENT (Нефт)</option>
            </optgroup>
            <optgroup label="💱 ҶУФТҲОИ АСОСИИ FOREX (MAJORS)">
                <option value="EUR/USD">EUR / USD (OTC)</option>
                <option value="GBP/USD">GBP / USD (OTC)</option>
                <option value="USD/JPY">USD / JPY (OTC)</option>
                <option value="USD/CHF">USD / CHF (OTC)</option>
                <option value="USD/CAD">USD / CAD (OTC)</option>
                <option value="AUD/USD">AUD / USD (OTC)</option>
                <option value="NZD/USD">NZD / USD (OTC)</option>
            </optgroup>
            <optgroup label="🌐 ҶУФТҲОИ КРОСС (CROSS CURRENCIES)">
                <option value="EUR/GBP">EUR / GBP (OTC)</option>
                <option value="EUR/JPY">EUR / JPY (OTC)</option>
                <option value="GBP/JPY">GBP / JPY (OTC)</option>
                <option value="AUD/CAD">AUD / CAD (OTC)</option>
                <option value="AUD/JPY">AUD / JPY (OTC)</option>
                <option value="CAD/JPY">CAD / JPY (OTC)</option>
                <option value="GBP/CAD">GBP / CAD (OTC)</option>
            </optgroup>
            <optgroup label="🚀 КРИПТОВАЛЮТАҲО (CRYPTO)">
                <option value="BTC/USD">BITCOIN / USD</option>
                <option value="ETH/USD">ETHEREUM / USD</option>
                <option value="SOL/USD">SOLANA / USD</option>
                <option value="XRP/USD">RIPPLE / USD</option>
            </optgroup>
        </select>

        <div class="label">Таймфрейм (Timeframe)</div>
        <div class="tf-group">
            <button class="tf-btn active" onclick="setTF(this, 'M1')">M1</button>
            <button class="tf-btn" onclick="setTF(this, 'M5')">M5</button>
            <button class="tf-btn" onclick="setTF(this, 'M15')">M15</button>
            <button class="tf-btn" onclick="setTF(this, 'M30')">M30</button>
            <button class="tf-btn" onclick="setTF(this, 'H1')">H1</button>
        </div>

        <div class="signal-box" id="signalBox">
            <div class="signal-title" id="sigText" style="color: #64748b;">ИНИТИАЛИЗАЦИЯ</div>
            <div class="signal-sub" id="sigSub">Активро интихоб карда тугмаро пахш кунед</div>
            <div class="progress-bar" id="pBar"></div>
        </div>

        <div class="details-grid">
            <div class="detail-card">
                <div class="label" style="font-size: 9px;">Дақиқии Нейросеть</div>
                <div class="detail-val" id="accuracy">96.4%</div>
            </div>
            <div class="detail-card">
                <div class="label" style="font-size: 9px;">Сигнали RSI & Volatility</div>
                <div class="detail-val" id="rsiVal">STRONG TREND</div>
            </div>
        </div>
        
        <button class="btn-analyze" id="btnMain" onclick="runAIAnalysis()">📊 ГИРИФТАНИ ТАҲЛИЛИ АСБОР</button>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        let selectedTF = "M1";

        function setTF(el, tf) {
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedTF = tf;
        }

        function runAIAnalysis() {
            const btn = document.getElementById('btnMain');
            const sigText = document.getElementById('sigText');
            const sigSub = document.getElementById('sigSub');
            const box = document.getElementById('signalBox');
            const pBar = document.getElementById('pBar');
            
            btn.disabled = true;
            sigText.innerText = "ТАҲЛИЛ РАФТА ИСТОДААСТ...";
            sigText.style.color = "#38bdf8";
            sigSub.innerText = "Нейросеть индикаторҳо ва бозорро мехонад";
            box.style.borderColor = "#0284c7";
            box.style.background = "#0f172a";

            let width = 0;
            pBar.style.width = "0%";
            
            const timer = setInterval(() => {
                width += 4;
                pBar.style.width = width + "%";
                if(width >= 100) {
                    clearInterval(timer);
                    showFinalResult();
                }
            }, 80);
        }

        function showFinalResult() {
            const btn = document.getElementById('btnMain');
            const sigText = document.getElementById('sigText');
            const sigSub = document.getElementById('sigSub');
            const box = document.getElementById('signalBox');
            const accuracy = document.getElementById('accuracy');
            const rsiVal = document.getElementById('rsiVal');

            const isBuy = Math.random() > 0.48;
            const pair = document.getElementById('pair').value;

            if(isBuy) {
                sigText.innerText = "BUY 🟢";
                sigText.style.color = "#22c55e";
                sigSub.innerText = `${pair} | Экспирация: ${selectedTF}`;
                box.style.background = "rgba(34, 197, 94, 0.12)";
                box.style.borderColor = "#22c55e";
                rsiVal.innerText = "OVERSOLD (BUY)";
                rsiVal.style.color = "#22c55e";
            } else {
                sigText.innerText = "SELL 🔴";
                sigText.style.color = "#ef4444";
                sigSub.innerText = `${pair} | Экспирация: ${selectedTF}`;
                box.style.background = "rgba(239, 68, 68, 0.12)";
                box.style.borderColor = "#ef4444";
                rsiVal.innerText = "OVERBOUGHT (SELL)";
                rsiVal.style.color = "#ef4444";
            }

            accuracy.innerText = (92 + Math.random() * 6.5).toFixed(1) + "%";
            btn.disabled = false;
        }
    </script>
</body>
</html>
